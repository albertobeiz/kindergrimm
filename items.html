<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>drawai — juguetería</title>
<style>
  :root { --ink: #1f1d1a; --paper: #f6f1e5; }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--paper); color: var(--ink); font: 12px/1.45 ui-monospace, "SF Mono", Menlo, monospace; }
  #hud {
    position: sticky; top: 0; z-index: 2;
    display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
    padding: 12px 18px 10px; letter-spacing: .06em;
    background: linear-gradient(var(--paper) 68%, rgba(246,241,229,0));
  }
  #hud h1 { font-size: 14px; letter-spacing: .14em; }
  #hud .hint { opacity: .45; }
  #hud a { color: inherit; text-decoration: none; border-bottom: 1px solid rgba(31,29,26,.35); }
  #hud a:hover { border-bottom-color: var(--ink); }
  #hud button {
    font: inherit; color: inherit; letter-spacing: .06em; cursor: pointer;
    background: none; border: 1px solid rgba(31,29,26,.35); border-radius: 3px;
    padding: 2px 9px;
  }
  #hud button:hover { border-color: var(--ink); }
  main { padding: 4px 18px 40px; }
  h2 { font-size: 12px; font-weight: normal; letter-spacing: .14em; opacity: .5; margin: 22px 0 8px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .it {
    width: 132px; padding: 8px 9px 9px;
    border: 1px solid rgba(31,29,26,.18); border-radius: 4px;
  }
  .it canvas { display: block; width: 108px; height: 108px; margin: 0 auto 6px; }
  .it b { display: block; font-weight: normal; font-size: 11px; letter-spacing: .04em; }
  /* the same three paragraphs the draft card prints: what it is, what
     it does to the numbers, what it costs */
  .it p { font-size: 10px; opacity: .5; line-height: 1.35; margin-top: 3px; }
  .it p.up { opacity: .95; color: #3d5a2e; }
  .it p.bad { opacity: .95; color: #8c2f2a; }
  .it em { display: block; font-style: normal; font-size: 9px; opacity: .35; margin-top: 4px; letter-spacing: .08em; }
  /* the rank ladder, echoing game.html */
  .r-sketch    { }
  .r-inked     { border-color: rgba(31,29,26,.45); }
  .r-gilded    { border-color: rgba(150,110,30,.6); background: rgba(198,158,58,.07); }
  .r-nightmare { border-color: rgba(120,40,80,.6); background: rgba(120,40,80,.06); border-width: 2px; }
</style>
</head>
<body>
  <div id="hud">
    <h1>juguetería</h1>
    <span class="hint">every family × every rank · the contact sheet for the object system</span>
    <button id="reroll">otra tirada</button>
    <a href="index.html">← menú</a>
  </div>
  <main id="sheet"></main>
  <!-- the sheet itself needs no three, but the map lets this page pull
       in rig.js from a console when you want to check an item ON a body -->
  <script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
  <script type="module">
    import { FAMILIES, rollItem, thumbFor } from './src/items/index.js';

    const RANKS = ['sketch', 'inked', 'gilded', 'nightmare'];
    const sheet = document.getElementById('sheet');

    function build() {
      sheet.innerHTML = '';
      for (const fam of FAMILIES) {
        const h = document.createElement('h2');
        h.textContent = `${fam.id} · ${fam.slot}`;
        sheet.appendChild(h);
        const row = document.createElement('div');
        row.className = 'row';
        for (const rank of RANKS) {
          for (let n = 0; n < 3; n++) {
            const it = rollItem(fam.id, rank, (Math.random() * 1e9) | 0);
            if (!it) continue;
            const card = document.createElement('div');
            card.className = `it r-${rank}`;
            // text FIRST: assigning innerHTML afterwards would
            // re-serialise the card and wipe the canvas blank
            card.innerHTML = `<b>${it.name}</b>`
              + (it.copy.what ? `<p>${it.copy.what}</p>` : '')
              + (it.copy.does ? `<p class="up">${it.copy.does}</p>` : '')
              + (it.copy.costs ? `<p class="bad">${it.copy.costs}</p>` : '')
              + `<em>${rank}</em>`;
            // 176px baked, shown at 108: sharp on a retina panel and
            // still inside the safe scaling band for the grain
            card.insertBefore(thumbFor(it, 176), card.firstChild);
            row.appendChild(card);
          }
        }
        sheet.appendChild(row);
      }
    }

    document.getElementById('reroll').onclick = build;
    build();
    window.__items = { FAMILIES, rollItem };
  </script>
</body>
</html>
