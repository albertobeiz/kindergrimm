<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>drawai — voxel lab</title>
<style>
  :root {
    --ink: #1f1d1a;
    --paper: #f6f1e5;
    --paper2: #ece6d6;
    --line: #c4bba6;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    display: flex; overflow: hidden;
    background: var(--paper); color: var(--ink);
    font: 13px/1.45 ui-monospace, "SF Mono", Menlo, monospace;
  }
  #stage { flex: 1; position: relative; min-width: 0; touch-action: none; }
  #stage canvas { display: block; }
  #count {
    position: absolute; left: 16px; bottom: 14px;
    opacity: .42; font-size: 11px; pointer-events: none;
  }
  #hint {
    position: absolute; left: 16px; top: 14px;
    opacity: .42; font-size: 11px; pointer-events: none;
  }

  #ui {
    width: 300px; flex: none; overflow-y: auto;
    padding: 14px 16px 40px;
    background: var(--paper2);
    border-left: 2px solid var(--ink);
  }
  #ui h1 { font-size: 15px; letter-spacing: .12em; margin-bottom: 2px; }
  #ui .sub { opacity: .55; font-size: 11px; margin-bottom: 14px; }
  #ui section { border-top: 1px solid var(--line); padding: 10px 0 12px; }
  #ui h2 {
    font-size: 10px; text-transform: uppercase; letter-spacing: .18em;
    opacity: .6; margin-bottom: 8px;
  }
  .row { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
  .row label { flex: 1; opacity: .8; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .val { width: 34px; text-align: right; opacity: .5; font-size: 11px; }

  button, select, input[type=text], input[type=number] {
    font: inherit; color: var(--ink);
    background: var(--paper); border: 1.5px solid var(--ink);
    border-radius: 3px; padding: 3px 8px;
  }
  button { cursor: pointer; }
  button:hover { background: #fff6e2; }
  button:active { transform: translateY(1px); }
  select { max-width: 150px; }
  input[type=range] { flex: 1.4; accent-color: var(--ink); }
  input[type=number] { width: 105px; }
  input[type=checkbox] { accent-color: var(--ink); }

  #chips, .chiprow { display: flex; flex-wrap: wrap; gap: 5px; }
  #chips button, .chiprow button { padding: 2px 8px; font-size: 12px; border-width: 1px; }
  #chips button.sel, .chiprow button.sel { background: var(--ink); color: var(--paper); }
  #chips button.locked::after { content: " 🔒"; font-size: 9px; }
  .chiprow { margin: 2px 0 8px; }

  #part-title { font-weight: bold; }
  #recipe-box {
    width: 100%; height: 150px; resize: vertical;
    font: 10px/1.4 ui-monospace, Menlo, monospace;
    background: var(--paper); color: var(--ink);
    border: 1.5px solid var(--ink); border-radius: 3px; padding: 6px;
  }
  .hint { font-size: 10px; opacity: .5; margin-top: 4px; }

  @media (max-width: 720px) {
    body { flex-direction: column; }
    #stage { height: 52vh; flex: none; }
    #ui { width: 100%; border-left: none; border-top: 2px solid var(--ink); }
  }
</style>
</head>
<body>
  <div id="stage">
    <div id="hint">drag = turn · wheel = zoom · click a part · space = reset</div>
    <div id="count"></div>
  </div>
  <div id="ui">
    <h1>voxel lab</h1>
    <div class="sub">procedural solids · <a href="index.html" style="color:inherit">← menu</a></div>

    <section>
      <h2>Character</h2>
      <div class="row">
        <label>seed</label>
        <input id="seed" type="number">
        <button id="dice" title="random seed">🎲</button>
      </div>
      <div class="row">
        <label>species</label>
        <select id="species"></select>
      </div>
      <div class="row">
        <label>palette</label>
        <select id="palette"></select>
      </div>
      <div class="row">
        <label>base</label>
        <select id="base"></select>
      </div>
      <div class="row"><button id="regen" style="flex:1">Regenerate (R)</button></div>
      <div class="hint">parts marked 🔒 are not regenerated</div>
    </section>

    <section>
      <h2>Parts <span style="opacity:.4;font-size:9px">(or click the model)</span></h2>
      <div id="chips"></div>
    </section>

    <section id="sec-part" hidden>
      <h2>Part · <span id="part-title"></span></h2>
      <div class="row">
        <button id="part-reroll">Reroll 🎲</button>
        <label style="flex:none;display:flex;align-items:center;gap:4px">
          <input id="part-lock" type="checkbox"> lock
        </label>
      </div>
      <div id="part-params"></div>
    </section>

    <section>
      <h2>Life</h2>
      <div class="hint">expression</div>
      <div id="faces" class="chiprow"></div>
      <div class="row"><label>breath</label><input id="anim-breath" type="checkbox" checked></div>
      <div class="row"><label>sway</label><input id="anim-sway" type="checkbox" checked></div>
      <div class="row"><label>blink</label><input id="anim-blink" type="checkbox" checked></div>
      <div class="row"><label>glance</label><input id="anim-gaze" type="checkbox" checked></div>
      <div class="row"><label>talk</label><input id="anim-talk" type="checkbox"></div>
    </section>

    <section>
      <h2>View</h2>
      <div class="row"><label>turntable</label><input id="turntable" type="checkbox" checked></div>
      <div class="row"><button id="reset-view" style="flex:1">Reset view (space)</button></div>
    </section>

    <section>
      <h2>Recipe</h2>
      <textarea id="recipe-box" spellcheck="false"></textarea>
      <div class="row" style="margin-top:6px">
        <button id="recipe-load">Apply JSON</button>
        <button id="recipe-copy">Copy</button>
      </div>
      <div class="hint">the recipe reproduces the exact character: save it and load it anywhere</div>
    </section>
  </div>
  <script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
  <script type="module" src="./src/voxel/voxel.js"></script>
</body>
</html>
