<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>drawai — multitud</title>
<style>
  :root { --ink: #1f1d1a; --paper: #f6f1e5; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; overflow: hidden; }
  body { background: var(--paper); color: var(--ink); font: 12px/1.45 ui-monospace, "SF Mono", Menlo, monospace; }
  #stage { position: absolute; inset: 0; }
  #stage canvas { display: block; }
  #hud {
    position: absolute; top: 0; left: 0; right: 0; z-index: 2;
    display: flex; align-items: baseline; gap: 14px;
    padding: 12px 18px 10px;
    letter-spacing: .06em;
    background: linear-gradient(var(--paper) 62%, rgba(246,241,229,0));
  }
  #hud h1 { font-size: 14px; letter-spacing: .14em; }
  #hud .hint { opacity: .45; }
  #hud a { color: inherit; text-decoration: none; border-bottom: 1px solid rgba(31,29,26,.35); }
  #hud a:hover { border-bottom-color: var(--ink); }
  #hud a.sel { font-weight: bold; border-bottom-width: 2px; }
  #count { position: absolute; bottom: 16px; left: 18px; z-index: 2; opacity: .45; }
</style>
</head>
<body>
  <div id="stage"></div>
  <div id="hud">
    <h1>multitud</h1>
    <span class="hint">click en una cara = otra persona · R = página nueva</span>
    <span id="species"></span>
    <span id="medias"></span>
    <a href="index.html">← menú</a>
  </div>
  <div id="count"></div>
  <script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
  <script type="module" src="./src/crowd.js"></script>
</body>
</html>
