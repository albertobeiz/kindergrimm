<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>drawai — voxel crowd</title>
<style>
  :root { --ink: #b9b2cf; --bg: #000; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; overflow: hidden; }
  body { background: var(--bg); color: var(--ink); font: 12px/1.45 ui-monospace, "SF Mono", Menlo, monospace; }
  #stage { position: absolute; inset: 0; touch-action: none; }
  #stage canvas { display: block; }
  /* a breath of vignette over the render, so the platform floats in
     the dark instead of ending at the screen's edge */
  #vignette {
    position: absolute; inset: 0; z-index: 1; pointer-events: none;
    background: radial-gradient(ellipse at 50% 44%, transparent 52%, rgba(0,0,0,.62) 100%);
  }
  #hud {
    position: absolute; top: 0; left: 0; right: 0; z-index: 2;
    display: flex; align-items: baseline; flex-wrap: wrap; gap: 14px;
    padding: 12px 18px 10px;
    letter-spacing: .06em; pointer-events: none;
    text-shadow: 0 1px 4px #000;
  }
  #hud h1 { font-size: 14px; letter-spacing: .14em; color: #d8d2ea; }
  #hud .hint { opacity: .5; }
  #hud a { color: inherit; text-decoration: none; border-bottom: 1px solid rgba(185,178,207,.4); pointer-events: auto; }
  #hud a:hover { border-bottom-color: var(--ink); }
  #count { position: absolute; bottom: 16px; left: 18px; z-index: 2; opacity: .45; pointer-events: none; }
  @media (max-width: 620px) { #hud .hint { font-size: 11px; } }
</style>
</head>
<body>
  <div id="stage"></div>
  <div id="vignette"></div>
  <div id="hud">
    <h1>voxel crowd</h1>
    <span class="hint">click one = another person · R = new crowd · drag = look around · wheel = zoom</span>
    <a href="index.html">← menu</a>
  </div>
  <div id="count"></div>
  <script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
  <script type="module" src="./src/voxel/vcrowd.js"></script>
</body>
</html>
