<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>drawai — gloss shelf</title>
<style>
  :root { --ink: #1f1d1a; --paper: #f6f1e5; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; overflow: hidden; }
  body { background: var(--paper); color: var(--ink); font: 12px/1.45 ui-monospace, "SF Mono", Menlo, monospace; }
  #stage { position: absolute; inset: 0; touch-action: none; }
  #stage canvas { display: block; }
  #hud {
    position: absolute; top: 0; left: 0; right: 0; z-index: 2;
    display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
    padding: 12px 18px 10px;
    letter-spacing: .06em;
    color: #241f19;
    text-shadow: 0 1px 0 rgba(255,255,255,.35);
  }
  #hud h1 { font-size: 14px; letter-spacing: .14em; }
  #hud .hint { opacity: .5; }
  #hud a { color: inherit; text-decoration: none; border-bottom: 1px solid rgba(36,31,25,.4); }
  #hud a:hover { border-bottom-color: currentColor; }
  #count {
    position: absolute; bottom: 16px; left: 18px; z-index: 2;
    opacity: .5; color: #241f19;
  }

  /* the filter bar: hold two dimensions still and look at the third.
     It was three rows of buttons and it competed with the sheet — the
     controls are the smallest thing on the page now, one line of plain
     selects that only come up to full contrast when you go for them. */
  #filters {
    position: absolute; top: 40px; left: 0; z-index: 2;
    display: flex; align-items: center; gap: 10px;
    padding: 2px 18px 8px;
    opacity: .4; transition: opacity .16s;
  }
  #filters:hover, #filters:focus-within { opacity: 1; }
  #filters select {
    font: inherit; font-size: 11px; letter-spacing: .08em;
    color: #241f19; cursor: pointer;
    background: transparent; border: 0; border-bottom: 1px solid rgba(36,31,25,.25);
    border-radius: 0; padding: 1px 2px;
    -webkit-appearance: none; appearance: none;
  }
  #filters select:hover, #filters select:focus { border-bottom-color: rgba(36,31,25,.7); outline: none; }
  /* a pinned palette is ONE dot, not a five-colour strip: the strip was
     a block of colour bigger than any toy on the sheet */
  #filters .dot {
    width: 9px; height: 9px; border-radius: 50%; margin-left: -6px;
    box-shadow: 0 0 0 1px rgba(36,31,25,.25) inset;
  }
  #filters .dot.off { display: none; }

  @media (max-width: 620px) {
    #filters { top: 56px; gap: 8px; padding: 2px 12px 8px; }
  }
</style>
</head>
<body>
  <div id="stage"></div>
  <div id="hud">
    <h1>gloss shelf</h1>
    <span class="hint">click a toy = mold another · drag = turn · wheel = zoom · space = straighten · R = new sheet</span>
    <a href="index.html">← menu</a>
  </div>
  <div id="filters"></div>
  <div id="count"></div>
  <script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
  <script type="module" src="./src/gloss/gcrowd.js"></script>
</body>
</html>
